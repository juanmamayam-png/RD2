# rapicampo/docker/docker-compose.db.yml
version: '3.9'

services:
  postgres_rapicampo:
    image: postgres:17-alpine
    container_name: rapicampo_postgres
    environment:
      POSTGRES_DB: rappicampo
      POSTGRES_USER: rappicampo_user
      POSTGRES_PASSWORD: Mi1137674074
    volumes:
      - rapicampo_postgres_data:/var/lib/postgresql/data
      - ../database/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rappicampo_user -d rappicampo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  rapicampo_postgres_data: