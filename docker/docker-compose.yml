version: '3.9'

services:

  # ── Nginx: Frontend + Proxy ──────────────────────────────────
  nginx:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: rapicampo_nginx
    ports:
      - "9000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - rapicampo_net

  # ── Backend Node.js 22 LTS ────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: rapicampo_backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DB_HOST=postgres_rapicampo
      - DB_PORT=5432
      - DB_NAME=rappicampo
      - DB_USER=rappicampo_user
      - DB_PASS=Mi1137674074
    depends_on:
      postgres_rapicampo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rapicampo_net

  # ── PostgreSQL 17 (sin PostGIS) ───────────────────────────────
  postgres_rapicampo:
    image: postgres:17-alpine
    container_name: rapicampo_postgres
    environment:
      POSTGRES_DB: rappicampo
      POSTGRES_USER: rappicampo_user
      POSTGRES_PASSWORD: Mi1137674074
    volumes:
      - rapicampo_postgres_data:/var/lib/postgresql/data
      - ../database/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rappicampo_user -d rappicampo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rapicampo_net

volumes:
  rapicampo_postgres_data:

networks:
  rapicampo_net:
    driver: bridge